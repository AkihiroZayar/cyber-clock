<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Clock</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
        background: #05060a;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    canvas {
        position: fixed;
        inset: 0;
        z-index: 0;
    }

    .container {
        position: relative;
        z-index: 2;
        width: min(900px, 90%);
        text-align: center;
    }

    .top {
        font-size: 13px;
        letter-spacing: 5px;
        text-transform: uppercase;
        opacity: 0.5;
        margin-bottom: 30px;
    }

    .clock {
        font-size: clamp(70px, 13vw, 150px);
        font-weight: 700;
        letter-spacing: -5px;
        line-height: 1;
        text-shadow:
            0 0 10px rgba(0,255,255,.7),
            0 0 40px rgba(0,255,255,.25);
    }

    .seconds {
        color: #00ffff;
    }

    .date {
        margin-top: 25px;
        font-size: 16px;
        letter-spacing: 4px;
        text-transform: uppercase;
        opacity: .65;
    }

    .card {
        margin: 50px auto 0;
        width: min(600px, 100%);
        padding: 25px;
        border: 1px solid rgba(255,255,255,.12);
        background: rgba(255,255,255,.05);
        backdrop-filter: blur(15px);
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }

    .message {
        font-size: 18px;
        margin-bottom: 20px;
    }

    button {
        border: 1px solid rgba(0,255,255,.5);
        background: rgba(0,255,255,.08);
        color: #00ffff;
        padding: 12px 25px;
        border-radius: 999px;
        cursor: pointer;
        font-size: 14px;
        transition: .25s;
    }

    button:hover {
        background: #00ffff;
        color: #05060a;
        box-shadow: 0 0 30px rgba(0,255,255,.5);
        transform: translateY(-2px);
    }

    .focus {
        margin-top: 18px;
        font-size: 12px;
        opacity: .4;
    }

    .focus-mode {
        background: #000;
    }

    .focus-mode .card,
    .focus-mode .date,
    .focus-mode .top {
        opacity: 0;
        pointer-events: none;
    }

    .focus-mode .clock {
        transform: scale(1.15);
    }

    .clock {
        transition: transform .5s ease;
    }
</style>
</head>

<body>

<canvas id="particles"></canvas>

<div class="container">

    <div class="top">
        SYSTEM TIME
    </div>

    <div class="clock">
        <span id="hours">00</span>:<span id="minutes">00</span>:<span class="seconds" id="seconds">00</span>
    </div>

    <div class="date" id="date">
        Loading...
    </div>

    <div class="card">
        <div class="message" id="message">
            Make today count.
        </div>

        <button onclick="focusMode()">
            ENTER FOCUS MODE
        </button>

        <div class="focus">
            Press ESC to exit focus mode
        </div>
    </div>

</div>

<script>
/* =========================
   CLOCK
========================= */

function updateClock() {

    const now = new Date();

    let hours = now.getHours();
    const minutes = now.getMinutes();
    const seconds = now.getSeconds();

    const pad = n => String(n).padStart(2, "0");

    document.getElementById("hours").textContent = pad(hours);
    document.getElementById("minutes").textContent = pad(minutes);
    document.getElementById("seconds").textContent = pad(seconds);

    const date = now.toLocaleDateString("en-US", {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
    });

    document.getElementById("date").textContent = date;

    updateMessage(hours);
}

function updateMessage(hour) {

    let text;

    if (hour >= 5 && hour < 12) {
        text = "Good morning. Start strong.";
    } 
    else if (hour >= 12 && hour < 18) {
        text = "Keep going. You're not done yet.";
    } 
    else if (hour >= 18 && hour < 23) {
        text = "Evening mode activated.";
    } 
    else {
        text = "The city sleeps. You don't have to.";
    }

    document.getElementById("message").textContent = text;
}

updateClock();
setInterval(updateClock, 1000);


/* =========================
   FOCUS MODE
========================= */

function focusMode() {
    document.body.classList.toggle("focus-mode");
}

document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
        document.body.classList.remove("focus-mode");
    }
});


/* =========================
   PARTICLES
========================= */

const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

let particles = [];

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();

class Particle {

    constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;

        this.size = Math.random() * 2 + .5;

        this.speedX = (Math.random() - .5) * .3;
        this.speedY = (Math.random() - .5) * .3;

        this.alpha = Math.random() * .6 + .2;
    }

    update() {
        this.x += this.speedX;
        this.y += this.speedY;

        if (this.x < 0) this.x = canvas.width;
        if (this.x > canvas.width) this.x = 0;

        if (this.y < 0) this.y = canvas.height;
        if (this.y > canvas.height) this.y = 0;
    }

    draw() {
        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = `rgba(0,255,255,${this.alpha})`;
        ctx.fill();
    }
}

for (let i = 0; i < 120; i++) {
    particles.push(new Particle());
}

function animate() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    for (const particle of particles) {
        particle.update();
        particle.draw();
    }

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
